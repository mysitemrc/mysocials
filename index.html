<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050912" />
  <meta name="description" content="Marc Zedrick Nervez – IT Graduate. Find me on my social media platforms." />
  <title>Marc Zedrick Nervez</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&family=Mrs+Saint+Delafield&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Decorative background shapes -->
  <div class="decor orb orb--tl" aria-hidden="true"></div>
  <div class="decor orb orb--br" aria-hidden="true"></div>
  <div class="decor dots dots--tr" aria-hidden="true"></div>
  <div class="decor dots dots--bl" aria-hidden="true"></div>
  <div class="decor line line--1" aria-hidden="true"></div>
  <div class="decor line line--2" aria-hidden="true"></div>
  <div class="decor line line--3" aria-hidden="true"></div>
  <div class="decor line line--4" aria-hidden="true"></div>

  <header class="site-header">
    <a class="logo" href="#">Marc Zedrick <span class="gradient-text">Nervez</span></a>
  </header>

  <main class="page">

    <!-- Profile -->
    <section class="profile">
      <div class="avatar">
        <!-- Replace profile.jpg with your own photo -->
        <img src="zed.jpg" alt="Photo of Marc Zedrick Nervez" width="200" height="200" />
      </div>

      <h1 class="name">Marc Zedrick <span class="gradient-text">Nervez</span></h1>
      <p class="role">IT Graduate</p>
      <p class="intro">Let's connect! You can find me on my social media platforms below.</p>
      <p class="script gradient-text" aria-hidden="true">Stay Connected</p>
    </section>

    <!-- Social links -->
    <!--
      Icon badges below use simple letters as placeholders.
      Swap each <span class="link__icon"> for the platform's official icon
      (from its brand resources page or your preferred icon library).
    -->
    <ul class="links">
      <li>
        <a class="link link--facebook" href="https://www.facebook.com/marczedrickk" target="_blank" rel="noopener noreferrer">
          <span class="link__icon" aria-hidden="true"><img src="facebook.png" alt="" /></span>
          <span class="link__text">
            <span class="link__title">Facebook</span>
            <span class="link__url">facebook.com/marczedrickk</span>
          </span>
          <svg class="link__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </a>
      </li>

      <li>
        <a class="link link--instagram" href="https://www.instagram.com/mrczdrckk/?hl=en" target="_blank" rel="noopener noreferrer">
          <span class="link__icon" aria-hidden="true"><img src="instagram.png" alt="" /></span>
          <span class="link__text">
            <span class="link__title">Instagram</span>
            <span class="link__url">instagram.com/mrczdrckk</span>
          </span>
          <svg class="link__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </a>
      </li>
    </ul>

  </main>

</body>
</html>
